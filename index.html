<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Leni! 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --neon-pink: #ff4081;
        --neon-purple: #e056fd;
        --text-white: #ffffff;
        --glass-dark: rgba(20, 20, 20, 0.65);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        height: 100vh;
        overflow: hidden;
        font-family: 'Poppins', sans-serif;
        background: radial-gradient(circle at center, #2e003e 0%, #000000 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-white);
    }

    /* SCATTERING EMOJI ANIMATION */
    .scatter-emoji {
        position: absolute;
        font-size: 1.5rem;
        pointer-events: none;
        opacity: 0;
        animation: scatterFade 2s ease-out forwards;
        z-index: 0;
    }

    @keyframes scatterFade {
        0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot)); opacity: 0; }
    }

    /* CARD STYLE */
    .card {
        position: relative;
        z-index: 10;
        background: var(--glass-dark);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 40px rgba(224, 86, 253, 0.2);
        border-radius: 25px;
        padding: 50px 35px;
        width: 90%;
        max-width: 480px;
        text-align: center;
        transition: transform 0.3s;
    }

    h3 {
        font-family: 'Parisienne', cursive;
        font-size: 2.5rem;
        background: linear-gradient(to right, #fff, #ff4081, #e056fd);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 15px;
        text-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    p {
        color: #ddd;
        font-size: 1rem;
        font-weight: 300;
        margin-bottom: 30px;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        padding: 15px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.1);
        color: white;
        text-align: center;
        font-size: 1.2rem;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        background: rgba(255, 255, 255, 0.2);
        border-color: var(--neon-pink);
        box-shadow: 0 0 15px rgba(255, 64, 129, 0.4);
    }

    button {
        margin-top: 20px;
        width: 100%;
        padding: 14px;
        border-radius: 50px;
        border: none;
        background: linear-gradient(90deg, #e056fd, #ff4081);
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(224, 86, 253, 0.4);
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(255, 64, 129, 0.6);
    }

    .wish-content {
        display: none;
        animation: glowIn 1.2s ease;
    }

    @keyframes glowIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    .message-box {
        text-align: left;
        background: rgba(255, 255, 255, 0.08);
        padding: 25px;
        border-radius: 15px;
        border-left: 3px solid var(--neon-pink);
        margin-top: 20px;
        line-height: 1.8;
        color: #eee;
        max-height: 350px;
        overflow-y: auto;
        font-size: 0.95rem;
    }

    /* PULSE ANIMATION CLASS */
    .heart-pulse {
        display: inline-block;
        animation: pulse 1s infinite;
        /* Emojis will inherit this animation */
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.3); }
    }

</style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="https://files.catbox.moe/j5k1d6.mp3" type="audio/mp3">
    </audio>

    <div class="card">

        <div id="loginSection">
            <h3>Happy Birthday Leni 💞</h3>
            <p>A little Magic For You.<br>Enter your birthday to open.</p>

            <input type="password" id="password" placeholder="DD/MM">
            <button onclick="unlock()">View Birthday Wish ✨</button>
            <p style="font-size: 0.8rem; opacity: 0.5; margin-top: 15px;">Hint: Your Special Day</p>
        </div>

        <div id="wishSection" class="wish-content">
            <h1>Happy Birthday! 🎉</h1>
            <div id="fullMessageContainer" class="message-box"></div>
            <button onclick="location.reload()" style="background: rgba(255,255,255,0.1); margin-top: 15px;">Close</button>
        </div>

    </div>

    <script>
        // --- PASSWORD ---
        const PASSWORD = "12/09"; 
        const EMOJIS = ["💞", "🎂", "🎉", "✨", "🌸", "💜"];
        
        // --- FULL MESSAGE CONTENT ---
        // දැන් හැම Emoji එකක්ම <span class="heart-pulse"> ඇතුලේ දමා ඇත.
        const fullMessageHTML = `
        <b>My Dearest Leni,</b><br><br>
        <span class="heart-pulse">✨🎂</span> Happy Birthday! <span class="heart-pulse">🎂✨</span><br>
        Wishing a fantastic birthday to the craziest, yet nice friend one could ask for.<br>
        I won't ask your age, but I definitely expect a big cake! <span class="heart-pulse">🎂🎉✨</span><br><br>
        I wish you great success in your studies and a happy life. <span class="heart-pulse">🎉✨</span><br><br>
        <i>With Love,<br>Poorna. <span class="heart-pulse">🫂✨</span></i>
        `;

        var i = 0;
        var speed = 40;

        // 1. SCATTER ANIMATION
        function createScatteredEmoji() {
            const el = document.createElement('div');
            el.classList.add('scatter-emoji');
            el.innerText = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = Math.random() * 100 + 'vh';
            const xMove = (Math.random() - 1.0) * 200 + 'px'; 
            const yMove = (Math.random() - 1.0) * 200 + 'px';
            const rot = (Math.random() * 360) + 'deg';
            el.style.setProperty('--tx', xMove);
            el.style.setProperty('--ty', yMove);
            el.style.setProperty('--rot', rot);
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }
        setInterval(createScatteredEmoji, 300);

        // 2. UPDATED SMART TYPEWRITER FUNCTION
        function typeWriter() {
            if (i < fullMessageHTML.length) {
                let char = fullMessageHTML.charAt(i);
                
                if (char === '<') {
                    // Span Tag එකක් දැක්කොත් මුළු කොටසම (Emoji එක්කම) එකපාර ගන්නවා
                    if (fullMessageHTML.substr(i, 5) === "<span") {
                        let endSpanIndex = fullMessageHTML.indexOf("</span>", i);
                        if (endSpanIndex !== -1) {
                            // සම්පූර්ණ <span ...>...</span> කොටසම එකපාර Add කරනවා
                            let fullSpan = fullMessageHTML.substring(i, endSpanIndex + 7);
                            document.getElementById("fullMessageContainer").innerHTML += fullSpan;
                            i = endSpanIndex + 7;
                        }
                    } else {
                        // සාමාන්‍ය Tag එකක් නම් (Example: <br>, <b>)
                        let tag = "";
                        while (fullMessageHTML.charAt(i) !== '>' && i < fullMessageHTML.length) {
                            tag += fullMessageHTML.charAt(i);
                            i++;
                        }
                        tag += '>';
                        i++;
                        document.getElementById("fullMessageContainer").innerHTML += tag;
                    }
                    setTimeout(typeWriter, 10); // Tags ඉක්මනට පනින්න
                } else {
                    document.getElementById("fullMessageContainer").innerHTML += char;
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
        }

        // 3. UNLOCK LOGIC
        function unlock() {
            const input = document.getElementById('password');
            const music = document.getElementById('bgMusic');

            if(input.value === PASSWORD) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('wishSection').style.display = 'block';
                music.play().catch(()=>{});

                for(let k=0; k<50; k++) {
                    setTimeout(createScatteredEmoji, k*20);
                }

                setTimeout(typeWriter, 500);

            } else {
                input.style.borderColor = "#ff4081";
                input.style.boxShadow = "0 0 15px #ff4081";
                setTimeout(() => {
                    input.style.borderColor = "rgba(255,255,255,0.3)";
                    input.style.boxShadow = "none";
                }, 500);
            }
        }
    </script>
</body>
</html>
